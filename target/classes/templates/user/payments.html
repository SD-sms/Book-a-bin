<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragments/head :: head('Payment Receipts | Book-A-Bin')}"
  ></head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h1 class="m-0">Your Payment Receipts</h1>
        <a th:href="@{/user/dashboard}" class="btn btn-ghost"
          >← Back to Dashboard</a
        >
      </div>
      <p class="text-muted">
        Below are all the payments you have made for your bookings.
      </p>

      <section>
        <div class="table-responsive">
          <table class="table table-striped table-sm">
            <thead>
              <tr>
                <th>Receipt ID</th>
                <th>Booking ID</th>
                <th>Amount</th>
                <th>Method</th>
                <th>Transaction ID</th>
                <th>Date</th>
                <th>Status</th>
                <th>Download</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="payment : ${payments}">
                <td th:text="${payment.id}"></td>
                <td
                  th:text="${payment.booking != null ? payment.booking.id : 'N/A'}"
                ></td>
                <td
                  th:text="${payment.booking != null && payment.booking.fine != null ? payment.booking.fine : 0}"
                ></td>
                <td th:text="${payment.amount}"></td>
                <td th:text="${payment.paymentMethod}"></td>
                <td th:text="${payment.transactionId}"></td>
                <td th:text="${payment.paymentDate}"></td>
                <td th:text="${payment.status}"></td>
                <td>
                  <a
                    th:href="@{'/user/payments/receipt/' + ${payment.id}}"
                    class="btn btn-ghost"
                    >View</a
                  >
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
