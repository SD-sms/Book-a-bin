<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Regular Schedules')}"></head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="m-0">Regular Collection Schedules</h1>
        <a th:href="@{/user/dashboard}" class="btn btn-link">← Back</a>
      </div>

      <div class="card">
        <div class="table-responsive">
          <table class="table table-sm">
            <thead>
              <tr>
                <th>ID</th>
                <th>Collector</th>
                <th>Area</th>
                <th>Date</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="s : ${schedules}">
                <td th:text="${s.id}"></td>
                <td
                  th:text="${s.collectorId != null ? s.collectorId : 'Unassigned'}"
                ></td>
                <td th:text="${s.area}"></td>
                <td th:text="${#temporals.format(s.date, 'dd-MM-yyyy')}"></td>
                <td th:text="${s.time}"></td>
              </tr>
              <tr th:if="${schedules == null or #lists.isEmpty(schedules)}">
                <td colspan="5" class="text-center">No schedules found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
