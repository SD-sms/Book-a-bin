<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Collector Profile')}"></head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-4">
      <div class="mx-auto max-w-640">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="m-0">Collector Profile</h1>
          <a th:href="@{/user/bookings}" class="btn btn-ghost">← Back</a>
        </div>

        <div class="card p-3">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <div th:text="${collector.name}" class="fw-bold"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <div th:text="${collector.phoneNumber}"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Location</label>
            <div th:text="${collector.location}"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Contact Email</label>
            <div th:text="${collector.email}"></div>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
