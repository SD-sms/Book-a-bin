<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Collector Profile')}"></head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-4">
      <div class="mx-auto max-w-720">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="m-0">Profile</h1>
          <a th:href="@{/collector/dashboard}" class="btn btn-ghost"
            >← Back to Dashboard</a
          >
        </div>

        <div class="card p-3">
          <form th:action="@{/collector/profile/update}" method="post">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input
                type="text"
                name="name"
                th:value="${collector.name}"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input
                type="text"
                name="phoneNumber"
                th:value="${collector.phoneNumber}"
                class="form-control"
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Location</label>
              <input
                type="text"
                name="location"
                th:value="${collector.location}"
                class="form-control"
              />
            </div>
            <button type="submit" class="btn btn-primary">Save Profile</button>
          </form>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
