<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Set Fixed Booking Fee')}"></head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-4">
      <div class="mx-auto max-w-640">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="m-0">Set Fixed Booking Fee</h2>
          <a th:href="@{/bbmp/dashboard}" class="btn btn-link"
            >← Back to Dashboard</a
          >
        </div>

        <div class="card p-3">
          <form th:action="@{/bbmp/set-fee}" method="post">
            <div class="mb-3">
              <label for="amount" class="form-label">Fixed Fee (in ₹)</label>
              <input
                type="number"
                step="0.01"
                id="amount"
                name="amount"
                th:value="${currentFee}"
                required
                class="form-control"
              />
            </div>

            <button type="submit" class="btn btn-primary">Update Fee</button>
          </form>
          <p class="text-muted mt-3">
            This fee will be applied to all new bookings.
          </p>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
