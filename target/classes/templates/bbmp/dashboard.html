<head th:replace="~{fragments/head :: head('BBMP Dashboard')}"></head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>
  <main class="container py-4">
    <div class="row g-3">
      <div class="col-md-4">
        <div class="card p-3">
          <h4>BBMP Actions</h4>
          <div class="d-grid gap-2 mt-2">
            <a class="btn btn-outline-primary" th:href="@{/bbmp/users}">View Users</a>
            <a class="btn btn-outline-primary" th:href="@{/bbmp/collectors}">View Collectors</a>
            <a class="btn btn-outline-primary" th:href="@{/bbmp/set-fee}">Set Collection Fee</a>
            <form th:action="@{/bbmp/set-fine}" method="post" class="d-flex gap-2">
              <input name="fineAmount" class="form-control form-control-sm" placeholder="Fine (₹)" />
              <button class="btn btn-sm btn-outline-danger" type="submit">Set Fine</button>
            </form>
            <form th:action="@{/bbmp/schedules/publish}" method="post" class="mt-2">
              <div class="mb-2">
                <input name="collectorId" class="form-control form-control-sm" placeholder="Collector ID" />
              </div>
              <div class="mb-2">
                <input name="area" class="form-control form-control-sm" placeholder="Area/Zone" />
              </div>
              <div class="mb-2 d-flex gap-2">
                <input name="date" type="date" class="form-control form-control-sm" />
                <input name="time" type="time" class="form-control form-control-sm" />
              </div>
              <button class="btn btn-sm btn-success" type="submit">Publish Schedule</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-8">
        <div class="card p-3">
          <h3>Summary</h3>
          <p class="mb-0">Use the actions on the left to manage users, collectors, fees and schedules.</p>
          <div class="mt-3">
            <a class="btn btn-sm btn-secondary" th:href="@{/forgot-password(role='bbmp')}">Change Password</a>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
