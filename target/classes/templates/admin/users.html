<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('All Users')}"></head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="m-0">All Registered Users</h1>
        <div>
          <a th:href="@{/admin/dashboard}" class="btn btn-link"
            >← Back to Dashboard</a
          >
          <button
            class="btn btn-primary btn-sm"
            data-bs-toggle="modal"
            data-bs-target="#addUserModal"
          >
            Add User
          </button>
        </div>
      </div>

      <div class="card">
        <div class="table-responsive">
          <table class="table table-striped mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.phone}"></td>
                <td>
                  <form
                    th:action="@{'/admin/delete/user/' + ${user.id}}"
                    method="post"
                    onsubmit="return confirm('Delete this user?');"
                  >
                    <button class="btn btn-sm btn-danger">Delete</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form th:action="@{/admin/add/user}" method="post">
            <div class="modal-header">
              <h5 class="modal-title">Add New User</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="mb-2">
                <label class="form-label">Username</label>
                <input name="username" class="form-control" required />
              </div>
              <div class="mb-2">
                <label class="form-label">Full Name</label>
                <input name="name" class="form-control" required />
              </div>
              <div class="mb-2">
                <label class="form-label">Email</label>
                <input
                  name="email"
                  type="email"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-2">
                <label class="form-label">Password</label>
                <input
                  name="password"
                  type="password"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-2">
                <label class="form-label">Phone</label>
                <input name="phone" class="form-control" />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">Create User</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
