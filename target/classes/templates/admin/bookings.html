<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('All Bookings')}"></head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="m-0">All Bookings</h1>
        <a th:href="@{/admin/dashboard}" class="btn btn-link"
          >← Back to Dashboard</a
        >
      </div>

      <div class="card">
        <div class="table-responsive">
          <table class="table table-sm table-hover mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>User</th>
                <th>Address</th>
                <th>Alt. Address</th>
                <th>Phone</th>
                <th>Description</th>
                <th>Booking Date & Time</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Payment Status</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="booking : ${bookings}">
                <td th:text="${booking.id}"></td>
                <td
                  th:text="${booking.user != null ? booking.user.username : 'N/A'}"
                ></td>
                <td th:text="${booking.location}"></td>
                <td
                  th:text="${booking.user != null ? booking.user.address : ''}"
                ></td>
                <td
                  th:text="${booking.user != null ? booking.user.phone : ''}"
                ></td>
                <td th:text="${booking.user != null ? '' : ''}"></td>
                <td
                  th:text="${#temporals.format(booking.preferredDateTime, 'dd-MM-yyyy HH:mm')}"
                ></td>
                <td
                  th:text="${booking.amount != null ? booking.amount : 0}"
                ></td>
                <td th:text="${booking.status}"></td>
                <td>
                  <span
                    th:text="${booking.status == 'Paid' ? 'Paid' : 'Pending'}"
                    th:classappend="${booking.status == 'Paid'} ? 'paid' : 'pending'"
                  >
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
