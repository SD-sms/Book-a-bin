<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Garbage Collectors')}"></head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="m-0">All Garbage Collectors</h1>
        <a th:href="@{/admin/dashboard}" class="btn btn-link"
          >← Back to Dashboard</a
        >
      </div>

      <div class="card">
        <div class="table-responsive">
          <table class="table table-striped mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Area Assigned</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="collector : ${collectors}">
                <td th:text="${collector.id}"></td>
                <td th:text="${collector.name}"></td>
                <td th:text="${collector.email}"></td>
                <td th:text="${collector.location}"></td>
                <td>
                  <div class="d-flex gap-2">
                    <form
                      th:action="@{'/admin/delete/collector/' + ${collector.id}}"
                      method="post"
                      onsubmit="return confirm('Delete this collector?');"
                    >
                      <button class="btn btn-sm btn-danger">Delete</button>
                    </form>
                    <!-- Edit removed: editing collectors is done via BBMP or dedicated admin page to
                         avoid accidental password exposure. -->
                  </div>
                </td>
                <!-- editing modal removed to simplify admin collector listing UI -->
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="mt-3">
        <button
          class="btn btn-primary btn-sm"
          data-bs-toggle="modal"
          data-bs-target="#addCollectorModal"
        >
          Add Collector
        </button>
      </div>
    </main>

    <!-- Add Collector Modal -->
    <div
      class="modal fade"
      id="addCollectorModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <form th:action="@{/admin/add/collector}" method="post">
            <div class="modal-header">
              <h5 class="modal-title">Add New Collector</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="mb-2">
                <label class="form-label">Name</label>
                <input name="name" class="form-control" required />
              </div>
              <div class="mb-2">
                <label class="form-label">Email</label>
                <input
                  name="email"
                  type="email"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-2">
                <label class="form-label">Password</label>
                <input
                  name="password"
                  type="password"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-2">
                <label class="form-label">Phone</label>
                <input name="phone" class="form-control" />
              </div>
              <div class="mb-2">
                <label class="form-label">Location / Area</label>
                <input name="location" class="form-control" />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                Create Collector
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
