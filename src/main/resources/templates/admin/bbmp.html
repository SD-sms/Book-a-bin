<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('BBMP Officials')}"></head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="m-0">BBMP Officials</h1>
        <a th:href="@{/admin/dashboard}" class="btn btn-link"
          >← Back to Dashboard</a
        >
      </div>

      <div class="card">
        <div class="table-responsive">
          <table class="table table-striped mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="bbmp : ${bbmps}">
                <td th:text="${bbmp.id}"></td>
                <td th:text="${bbmp.name}"></td>
                <td th:text="${bbmp.email}"></td>
                <td th:text="${bbmp.address}"></td>
                <td>
                  <form
                    th:action="@{'/admin/delete/bbmp/' + ${bbmp.id}}"
                    method="post"
                    onsubmit="return confirm('Delete this BBMP official?');"
                  >
                    <button class="btn btn-sm btn-danger">Delete</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
