<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragments/head :: head('BBMP - Manage Collectors')}"
  ></head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">BBMP — Collectors & Users</h2>
        <a th:href="@{/bbmp/dashboard}" class="btn btn-outline-secondary btn-sm"
          >Back to Dashboard</a
        >
      </div>

      <div class="card mb-4">
        <div class="card-body">
          <h5 class="card-title">Registered Collectors</h5>
          <div class="table-responsive">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Location</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="collector : ${collectors}">
                  <td th:text="${collector.id}"></td>
                  <td th:text="${collector.name}"></td>
                  <td th:text="${collector.email}"></td>
                  <td th:text="${collector.phoneNumber}"></td>
                  <td th:text="${collector.location}"></td>
                  <td>
                    <div class="d-flex gap-2">
                      <form
                        th:action="@{'/bbmp/collectors/update-location/' + ${collector.id}}"
                        method="post"
                        class="d-flex gap-1"
                      >
                        <input
                          name="location"
                          class="form-control form-control-sm"
                          th:placeholder="${collector.location}"
                        />
                        <button
                          class="btn btn-sm btn-outline-primary"
                          type="submit"
                        >
                          Update
                        </button>
                      </form>

                      <form
                        th:action="@{'/bbmp/collectors/delete/' + ${collector.id}}"
                        method="post"
                        onsubmit="return confirm('Delete this collector?');"
                      >
                        <button class="btn btn-sm btn-danger" type="submit">
                          Delete
                        </button>
                      </form>
                    </div>
                  </td>
                </tr>
                <tr th:if="${collectors == null or #lists.isEmpty(collectors)}">
                  <td colspan="6" class="text-center">
                    No collectors registered.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="card mb-4">
            <div class="card-body">
              <h5 class="card-title">Add New Collector</h5>
              <form th:action="@{/bbmp/collectors/add}" method="post">
                <div class="mb-2">
                  <label class="form-label">Name</label>
                  <input
                    class="form-control"
                    type="text"
                    name="username"
                    required
                  />
                </div>
                <div class="mb-2">
                  <label class="form-label">Email</label>
                  <input
                    class="form-control"
                    type="email"
                    name="email"
                    required
                  />
                </div>
                <div class="mb-2">
                  <label class="form-label">Password</label>
                  <input
                    class="form-control"
                    type="password"
                    name="password"
                    required
                  />
                </div>
                <div class="mb-2">
                  <label class="form-label">Phone</label>
                  <input
                    class="form-control"
                    type="text"
                    name="phoneNumber"
                    required
                  />
                </div>
                <div class="mb-2">
                  <label class="form-label">Location / Area</label>
                  <input
                    class="form-control"
                    type="text"
                    name="location"
                    required
                  />
                </div>
                <button class="btn btn-primary" type="submit">
                  Add Collector
                </button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card mb-4">
            <div class="card-body">
              <h5 class="card-title">Registered Users</h5>
              <div class="table-responsive">
                <table class="table table-sm">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Name</th>
                      <th>Email</th>
                      <th>Phone</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="user : ${users}">
                      <td th:text="${user.id}"></td>
                      <td th:text="${user.name}"></td>
                      <td th:text="${user.email}"></td>
                      <td th:text="${user.phone}"></td>
                    </tr>
                    <tr th:if="${users == null or #lists.isEmpty(users)}">
                      <td colspan="4" class="text-center">
                        No registered users.
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
