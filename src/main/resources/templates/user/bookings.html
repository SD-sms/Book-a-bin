<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('My Bookings')}"></head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-4">
      <h1 class="mb-3">My Past Bookings</h1>

      <div class="table-responsive">
        <table class="table table-bordered table-hover">
          <thead>
            <tr>
              <th>Booking ID</th>
              <th>Date & Time</th>
              <th>Location</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Collector</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="booking : ${bookings}">
              <td th:text="${booking.id}"></td>
              <td
                th:text="${#temporals.format(booking.preferredDateTime, 'dd-MM-yyyy HH:mm')}"
              ></td>
              <td th:text="${booking.location}"></td>
              <td>
                <span th:text="${booking.amount}"></span>
              </td>
              <td th:text="${booking.status}"></td>
              <td>
                <span th:if="${booking.collector != null}">
                  <a
                    th:href="@{'/collector/public/' + ${booking.collector.id}}"
                    th:text="${booking.collector.name}"
                  ></a>
                </span>
                <span th:if="${booking.collector == null}">-</span>
              </td>
              <td>
                <form
                  th:action="@{'/user/delete-booking/' + ${booking.id}}"
                  method="post"
                  onsubmit="return confirm('Are you sure you want to delete this booking?');"
                >
                  <button
                    type="submit"
                    class="btn btn-sm btn-danger"
                    th:if="${booking.status.equalsIgnoreCase('Pending')}"
                  >
                    Delete
                  </button>
                  <span th:if="${!booking.status.equalsIgnoreCase('Pending')}"
                    >-</span
                  >
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <a th:href="@{/user/dashboard}" class="btn btn-link mt-3"
        >← Back to Dashboard</a
      >
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
