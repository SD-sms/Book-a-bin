<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragments/head :: head('Payment Receipt | Book-A-Bin')}"
  ></head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-4">
      <div class="mx-auto card-panel max-w-720">
        <h2 class="mb-2">Payment Receipt</h2>

        <div class="mb-3">
          <label class="text-muted">Receipt #</label>
          <div th:text="${payment.id}"></div>
        </div>

        <div class="mb-3">
          <label class="text-muted">Paid By</label>
          <div
            th:text="${payment.user != null ? payment.user.name : (payment.booking != null ? payment.booking.user.name : 'N/A')}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="text-muted">Amount</label>
          <div>₹<span th:text="${payment.amount}"></span></div>
        </div>

        <div class="mb-3">
          <label class="text-muted">Payment Method</label>
          <div th:text="${payment.paymentMethod}"></div>
        </div>

        <div class="mb-3">
          <label class="text-muted">Transaction ID</label>
          <div th:text="${payment.transactionId}"></div>
        </div>

        <div class="mb-3">
          <label class="text-muted">Payment Date</label>
          <div
            th:text="${#temporals.format(payment.paymentDate, 'dd MMM yyyy HH:mm')}"
          ></div>
        </div>

        <div th:if="${payment.booking != null}" class="mb-3">
          <label class="text-muted">Booking</label>
          <div>
            <span th:text="${payment.booking.location}"></span> —
            <span
              th:text="${#temporals.format(payment.booking.preferredDateTime, 'dd MMM yyyy HH:mm')}"
            ></span>
          </div>
        </div>

        <div class="mt-3">
          <a th:href="@{/user/payments}" class="btn btn-ghost"
            >Back to Payments</a
          >
          &nbsp;
          <a th:href="@{/user/dashboard}" class="btn btn-ghost"
            >Back to Dashboard</a
          >
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
