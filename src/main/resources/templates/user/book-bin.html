<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Book a Bin')}"></head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-4">
      <div class="mx-auto max-w-720">
        <h1 class="mb-3">Book a Bin</h1>
        <p class="text-muted">
          Current Fee: ₹<span th:text="${latestFee}"></span>
        </p>

        <div class="card p-3">
          <form
            th:action="@{/user/book-bin}"
            method="post"
            th:object="${booking}"
          >
            <div class="mb-3">
              <label class="form-label">Location</label>
              <input
                type="text"
                th:field="*{location}"
                required
                class="form-control"
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Preferred Date & Time</label>
              <input
                type="datetime-local"
                th:field="*{preferredDateTime}"
                required
                class="form-control"
              />
            </div>

            <button type="submit" class="btn btn-primary">
              Confirm Booking
            </button>
          </form>
        </div>

        <a th:href="@{/user/dashboard}" class="btn btn-link mt-3"
          >← Back to Dashboard</a
        >
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
