<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragments/head :: head('Reset Password | Book-A-Bin')}"
  ></head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main class="container py-5">
      <div class="mx-auto max-w-540">
        <h2 class="mb-3">Reset Password</h2>

        <form id="forgotForm" autocomplete="off">
          <div class="mb-3">
            <label for="role" class="form-label">Role</label>
            <select id="role" name="role" class="form-select">
              <option value="user">User</option>
              <option value="collector">Collector</option>
              <option value="bbmp">BBMP Official</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="identifier" class="form-label">Username or Email</label>
            <input
              id="identifier"
              name="identifier"
              type="text"
              required
              class="form-control"
            />
          </div>

          <div class="mb-3">
            <label for="newPassword" class="form-label">New Password</label>
            <input
              id="newPassword"
              name="newPassword"
              type="password"
              required
              class="form-control"
            />
          </div>

          <button type="submit" class="btn btn-primary">Reset Password</button>
        </form>

        <p id="msg" class="mt-3 text-muted"></p>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const qrole = params.get('role');
        if (qrole) {
          const sel = document.getElementById('role');
          sel.value = qrole;
        }

        document
          .getElementById('forgotForm')
          .addEventListener('submit', async function (e) {
            e.preventDefault();
            const role = document.getElementById('role').value;
            const identifier = document.getElementById('identifier').value;
            const newPassword = document.getElementById('newPassword').value;

            try {
              const res = await fetch('/api/forgot-password', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({ role, identifier, newPassword }),
              });
              const data = await res.json();
              if (data.status === 'success') {
                document.getElementById('msg').innerText =
                  'Password reset successful. You may now login.';
              } else {
                document.getElementById('msg').innerText =
                  'Error: ' + (data.error || 'unknown');
              }
            } catch (err) {
              document.getElementById('msg').innerText = 'Network error';
            }
          });
      })();
    </script>
  </body>
</html>
