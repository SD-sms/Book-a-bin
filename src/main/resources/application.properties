# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/bookabin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Shree@1234ram
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# Hibernate / JPA Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# Thymeleaf Configuration
# ===============================
spring.thymeleaf.cache=false

# ===============================
# Logging
# ===============================
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG

# CORS (development) - also configured in SecurityConfig
spring.mvc.cors.allowed-origins=http://localhost:8080,http://localhost:5500
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allow-credentials=true

# Session timeout
server.servlet.session.timeout=30m

# Disable devtools automatic restart (can cause classloader/native issues during startup in some environments)
spring.devtools.restart.enabled=false
